<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF Geristro</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

:root{
    --bg:#0f172a;
    --card:#1e293b;
    --card-hover:#334155;
    --border:#475569;
    --text:#f8fafc;
    --text-secondary:#94a3b8;
    --primary:#3b82f6;
    --success:#22c55e;
    --warning:#f59e0b;
    --danger:#ef4444;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:20px;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.logo{
    font-size:28px;
    font-weight:700;
}

.logo span{
    color:var(--primary);
}

.status-supabase{
    font-size:13px;
    color:var(--text-secondary);
}

.dashboard{
    margin-bottom:25px;
}

.dashboard-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.dashboard-card{
    background:var(--card);
    border:1px solid var(--border);
    padding:20px;
    border-radius:12px;
}

.dashboard-card span{
    color:var(--text-secondary);
    font-size:14px;
}

.dashboard-card h2{
    margin-top:10px;
    font-size:30px;
}

.formulario{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    margin-bottom:25px;
}

.formulario h3{
    margin-bottom:15px;
}

input, textarea{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#0f172a;
    color:white;
    margin-bottom:10px;
}

textarea{
    resize:vertical;
    min-height:100px;
}

button{
    background:var(--primary);
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

button:hover{
    opacity:.9;
}

.kanban{
    display:flex;
    gap:20px;
}

.coluna{
    flex:1;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
}

.coluna-header{
    padding:15px;
    font-weight:700;
    text-align:center;
}

.a-fazer{ border-top:4px solid var(--warning); }
.fazendo{ border-top:4px solid var(--primary); }
.concluido{ border-top:4px solid var(--success); }

.lista{
    padding:15px;
    min-height:500px;
}

.tarefa{
    background:#273449;
    border-left:4px solid var(--primary);
    border-radius:10px;
    padding:15px;
    margin-bottom:12px;
    cursor:grab;
    transition:.2s;
}

.tarefa:hover{
    background:var(--card-hover);
    transform:translateY(-2px);
}

.tarefa h4{ margin-bottom:8px; }

.tarefa p{
    color:var(--text-secondary);
    margin-bottom:10px;
    font-size:14px;
    white-space:pre-wrap;
}

.info{
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:12px;
    color:#cbd5e1;
}

.acoes{
    display:flex;
    gap:8px;
    margin-top:12px;
    flex-wrap:wrap;
}

.btn-editar{
    background:var(--warning);
    padding:9px 12px;
    font-size:12px;
}

.btn-apagar{
    background:var(--danger);
    padding:9px 12px;
    font-size:12px;
}

.progresso{
    margin-top:20px;
    background:#111827;
    border-radius:20px;
    overflow:hidden;
    height:12px;
}

.progresso-barra{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#2563eb,#22c55e);
    transition:.4s;
}

footer{
    margin-top:30px;
    text-align:center;
    color:var(--text-secondary);
    font-size:13px;
}

@media(max-width:900px){
    .kanban{ flex-direction:column; }
}
</style>
</head>
<body>

<header>
    <div class="logo">FF <span>Geristro</span></div>
    <div class="status-supabase" id="statusSupabase">Conectando...</div>
</header>

<section class="dashboard">
    <div class="dashboard-grid">
        <div class="dashboard-card">
            <span>Total de Atividades</span>
            <h2 id="total">0</h2>
        </div>
        <div class="dashboard-card">
            <span>A Fazer</span>
            <h2 id="todoCount">0</h2>
        </div>
        <div class="dashboard-card">
            <span>Fazendo</span>
            <h2 id="doingCount">0</h2>
        </div>
        <div class="dashboard-card">
            <span>Concluído</span>
            <h2 id="doneCount">0</h2>
        </div>
        <div class="dashboard-card">
            <span>Progresso</span>
            <h2 id="progressText">0%</h2>
            <div class="progresso">
                <div class="progresso-barra" id="progressBar"></div>
            </div>
        </div>
    </div>
</section>

<section class="formulario">
    <h3>Nova Atividade</h3>
    <input type="text" id="titulo" placeholder="Título da atividade">
    <textarea id="descricao" placeholder="Descrição da atividade"></textarea>
    <button onclick="criarTarefa()">Adicionar Atividade</button>
</section>

<section class="kanban">
    <div class="coluna a-fazer">
        <div class="coluna-header">📋 A Fazer</div>
        <div class="lista" id="todo" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
    </div>

    <div class="coluna fazendo">
        <div class="coluna-header">⚙️ Fazendo</div>
        <div class="lista" id="doing" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
    </div>

    <div class="coluna concluido">
        <div class="coluna-header">✅ Concluído</div>
        <div class="lista" id="done" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
    </div>
</section>

<footer>FF Geristro © 2026 - Gestão de Atividades</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/*
IMPORTANTE:
1. Troque SUPABASE_KEY pela sua anon public key do Supabase.
2. Crie a tabela no Supabase com este SQL:

create table tarefas (
  id uuid primary key default gen_random_uuid(),
  titulo text not null,
  descricao text,
  status text default 'todo',
  inicio timestamptz default now(),
  concluido_em timestamptz,
  created_at timestamptz default now()
);

alter table tarefas enable row level security;

create policy "Permitir leitura" on tarefas for select to anon using (true);
create policy "Permitir inserir" on tarefas for insert to anon with check (true);
create policy "Permitir atualizar" on tarefas for update to anon using (true);
create policy "Permitir excluir" on tarefas for delete to anon using (true);
*/

const SUPABASE_URL = "https://dkjojycfqzkfrnyphitta.supabase.co";
const SUPABASE_KEY = "COLE_AQUI_SUA_ANON_PUBLIC_KEY";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const statusSupabase = document.getElementById("statusSupabase");

window.onload = carregarTarefas;

async function carregarTarefas(){
    limparListas();

    const { data, error } = await supabaseClient
        .from("tarefas")
        .select("*")
        .order("created_at", { ascending:true });

    if(error){
        console.error(error);
        statusSupabase.innerText = "Erro ao carregar Supabase";
        alert("Erro ao carregar tarefas. Verifique a anon public key e as políticas RLS.");
        return;
    }

    data.forEach(tarefa => renderizarTarefa(tarefa));
    atualizarDashboard();
    statusSupabase.innerText = "Supabase conectado";
}

function limparListas(){
    document.getElementById("todo").innerHTML = "";
    document.getElementById("doing").innerHTML = "";
    document.getElementById("done").innerHTML = "";
}

async function criarTarefa(){
    const titulo = document.getElementById("titulo").value.trim();
    const descricao = document.getElementById("descricao").value.trim();

    if(!titulo){
        alert("Informe o título da atividade.");
        return;
    }

    const { data, error } = await supabaseClient
        .from("tarefas")
        .insert([{ titulo, descricao, status:"todo" }])
        .select()
        .single();

    if(error){
        console.error(error);
        alert("Erro ao criar tarefa.");
        return;
    }

    renderizarTarefa(data);

    document.getElementById("titulo").value = "";
    document.getElementById("descricao").value = "";

    atualizarDashboard();
}

function renderizarTarefa(tarefa){
    const card = document.createElement("div");

    card.className = "tarefa";
    card.id = tarefa.id;
    card.draggable = true;
    card.dataset.inicio = tarefa.inicio || tarefa.created_at;
    card.ondragstart = drag;

    const tempoTexto = tarefa.status === "done"
        ? calcularTempo(card.dataset.inicio, tarefa.concluido_em || new Date())
        : "⏱ Em andamento";

    card.innerHTML = `
        <h4>${escaparHtml(tarefa.titulo)}</h4>
        <p class="descricao">${escaparHtml(tarefa.descricao || "")}</p>

        <div class="info">
            <span>${formatarData(tarefa.created_at)}</span>
            <span class="tempo">${tempoTexto}</span>
        </div>

        <div class="acoes">
            <button class="btn-editar" onclick="editarDescricao('${tarefa.id}')">Editar descrição</button>
            <button class="btn-apagar" onclick="apagarTarefa('${tarefa.id}')">Apagar</button>
        </div>
    `;

    const coluna = document.getElementById(tarefa.status || "todo");
    coluna.appendChild(card);
}

function allowDrop(ev){
    ev.preventDefault();
}

function drag(ev){
    ev.dataTransfer.setData("text", ev.target.id);
}

async function drop(ev){
    ev.preventDefault();

    const id = ev.dataTransfer.getData("text");
    const tarefa = document.getElementById(id);
    const coluna = ev.target.closest(".lista");

    if(!coluna || !tarefa){
        return;
    }

    coluna.appendChild(tarefa);

    const novoStatus = coluna.id;
    const concluidoEm = novoStatus === "done" ? new Date().toISOString() : null;

    const { error } = await supabaseClient
        .from("tarefas")
        .update({ status:novoStatus, concluido_em:concluidoEm })
        .eq("id", id);

    if(error){
        console.error(error);
        alert("Erro ao atualizar status.");
        carregarTarefas();
        return;
    }

    if(novoStatus === "done"){
        tarefa.querySelector(".tempo").innerHTML = calcularTempo(tarefa.dataset.inicio, concluidoEm);
    }else{
        tarefa.querySelector(".tempo").innerHTML = "⏱ Em andamento";
    }

    atualizarDashboard();
}

async function editarDescricao(id){
    const tarefa = document.getElementById(id);
    const descricaoAtual = tarefa.querySelector(".descricao").innerText;
    const novaDescricao = prompt("Editar descrição:", descricaoAtual);

    if(novaDescricao === null){
        return;
    }

    const { error } = await supabaseClient
        .from("tarefas")
        .update({ descricao:novaDescricao.trim() })
        .eq("id", id);

    if(error){
        console.error(error);
        alert("Erro ao editar descrição.");
        return;
    }

    tarefa.querySelector(".descricao").innerText = novaDescricao.trim();
}

async function apagarTarefa(id){
    if(!confirm("Deseja apagar esta atividade?")){
        return;
    }

    const { error } = await supabaseClient
        .from("tarefas")
        .delete()
        .eq("id", id);

    if(error){
        console.error(error);
        alert("Erro ao apagar tarefa.");
        return;
    }

    document.getElementById(id).remove();
    atualizarDashboard();
}

function atualizarDashboard(){
    const todo = document.getElementById("todo").children.length;
    const doing = document.getElementById("doing").children.length;
    const done = document.getElementById("done").children.length;
    const total = todo + doing + done;

    document.getElementById("total").innerText = total;
    document.getElementById("todoCount").innerText = todo;
    document.getElementById("doingCount").innerText = doing;
    document.getElementById("doneCount").innerText = done;

    const progresso = total > 0 ? Math.round((done / total) * 100) : 0;

    document.getElementById("progressText").innerText = progresso + "%";
    document.getElementById("progressBar").style.width = progresso + "%";
}

function calcularTempo(inicio, fim){
    const dataInicio = new Date(inicio).getTime();
    const dataFim = new Date(fim).getTime();
    const segundos = Math.floor((dataFim - dataInicio) / 1000);

    const horas = Math.floor(segundos / 3600);
    const minutos = Math.floor((segundos % 3600) / 60);
    const seg = segundos % 60;

    return `✅ ${horas}h ${minutos}m ${seg}s`;
}

function formatarData(data){
    if(!data){
        return "Criado agora";
    }

    return new Date(data).toLocaleString("pt-BR", {
        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"
    });
}

function escaparHtml(texto){
    const div = document.createElement("div");
    div.innerText = texto;
    return div.innerHTML;
}
</script>

</body>
</html>
