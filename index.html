
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Registros - Painel de Controle</title>
    <!-- SDK do Supabase para conexão com Banco de Dados -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0a0e14;
            --card-dark: #161b22;
            --primary-blue: #0056b3;
            --accent-cyan: #3fc1c9;
            --text-white: #f0f6fc;
            --border-color: #30363d;
            --success: #238636;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }

        /* Navbar */
        .navbar {
            background-color: #000;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-cyan);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-info {
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Container */
        .container {
            padding: 2rem 5%;
            max-width: 1200px;
            margin: auto;
        }

        /* Cards */
        .card {
            background: var(--card-dark);
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        h3 {
            margin-bottom: 20px;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
        }

        /* Forms */
        .grid-form {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 15px;
        }

        input, select {
            background: #0d1117;
            border: 1px solid var(--border-color);
            padding: 12px;
            color: white;
            border-radius: 6px;
            outline: none;
            width: 100%;
        }

        input:focus {
            border-color: var(--accent-cyan);
        }

        .btn-primary {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: var(--accent-cyan);
            color: #000;
        }

        /* Tabela */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        .data-table th {
            text-align: left;
            border-bottom: 2px solid var(--border-color);
            padding: 12px;
            color: #8b949e;
        }

        .data-table td {
            padding: 15px 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            background: var(--success);
            color: white;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .grid-form {
                grid-template-columns: 1fr;
            }
            .navbar {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">FF REGISTROS</div>
        <div class="user-info">
            <span>Login: Operador NOC</span>
        </div>
    </nav>

    <main class="container">
        <!-- Seção Adicionar Condomínio -->
        <section class="card">
            <h3>Adicionar Novo Condomínio</h3>
            <form id="form-condominio" class="grid-form">
                <input type="text" id="nome-condo" placeholder="Nome do Condomínio" required>
                <input type="text" id="cod-registro" placeholder="Código de Registro" readonly>
                <button type="submit" class="btn-primary">Registrar no Banco</button>
            </form>
        </section>

        <!-- Seção Registros de Hoje -->
        <section class="card">
            <div class="header-section">
                <h3>Registros de Hoje</h3>
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Condomínio</th>
                        <th>Registro</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Registros do Supabase serão inseridos aqui -->
                    <tr>
                        <td colspan="4" style="text-align:center; color:#8b949e; padding: 20px;">
                            Aguardando conexão com banco de dados...
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script>
        // CONFIGURAÇÕES DO SUPABASE
        // Substitua 'SUA_URL' e 'SUA_CHAVE_ANON' pelos dados do seu projeto Supabase
        const SUPABASE_URL = 'SUA_URL_DO_SUPABASE';
        const SUPABASE_KEY = 'SUA_CHAVE_ANON_DO_SUPABASE';
        
        let supabaseClient;
        
        if(SUPABASE_URL !== 'SUA_URL_DO_SUPABASE') {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        const form = document.getElementById('form-condominio');
        const tabela = document.getElementById('table-body');

        // Função para cadastrar no Banco
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if(!supabaseClient) {
                alert('Configure as chaves do Supabase no código para salvar online.');
                return;
            }

            const nome = document.getElementById('nome-condo').value;
            const codigo = 'FF-' + Math.floor(Math.random() * 90000 + 10000);

            const { data, error } = await supabaseClient
                .from('registros_acesso')
                .insert([
                    { condominio: nome, codigo_registro: codigo, tipo_acesso: 'Novo Cadastro' }
                ]);

            if (error) {
                console.error('Erro:', error);
                alert('Erro ao salvar no banco.');
            } else {
                document.getElementById('cod-registro').value = codigo;
                alert('Condomínio ' + nome + ' salvo com sucesso!');
                buscarDados();
            }
        });

        // Função para buscar dados de hoje
        async function buscarDados() {
            if(!supabaseClient) return;

            const hoje = new Date().toISOString().split('T')[0];

            const { data, error } = await supabaseClient
                .from('registros_acesso')
                .select('*')
                .gte('data_hora', hoje)
                .order('data_hora', { ascending: false });

            if (data) {
                tabela.innerHTML = '';
                if(data.length === 0) {
                    tabela.innerHTML = '<tr><td colspan="4" style="text-align:center;">Nenhum registro hoje.</td></tr>';
                    return;
                }
                data.forEach(reg => {
                    const hora = new Date(reg.data_hora).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
                    tabela.innerHTML += `
                        <tr>
                            <td>${hora}</td>
                            <td>${reg.condominio}</td>
                            <td>${reg.codigo_registro}</td>
                            <td><span class="badge">Concluído</span></td>
                        </tr>
                    `;
                });
            }
        }

        // Inicia a busca ao carregar a página
        if(supabaseClient) buscarDados();
    </script>
</body>
</html>
